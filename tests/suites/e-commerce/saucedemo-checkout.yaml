id: saucedemo-checkout
module: e-commerce
name: Bộ kiểm thử phân hệ E-Commerce SauceDemo Swag Labs
description: Kịch bản kiểm thử toàn diện Heuristics SFDIPOT trên nền tảng demo Swag Labs
target_url: https://www.saucedemo.com/
environment: local
tags:
  - smoke
  - regression
  - e2e
  - saucedemo
  - automated
  - standard-suite
created_at: 2026-11-07T14:35:00.000Z
updated_at: 2026-11-07T14:35:00.000Z
cases:
  - id: TC-ECOMMERCE-001
    title: Đăng nhập thành công với tài khoản chuẩn (Happy Path)
    description: Xác thực người dùng standard_user đăng nhập thành công và truy cập trang danh mục sản phẩm
    priority: P1
    type: happy_path
    tags:
      - smoke
      - p1
      - core
      - happy_path
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "standard_user" vào ô "Username"
        data: standard_user
        expected: Ô Username hiển thị giá trị standard_user
      - step: 2
        action: Điền "secret_sauce" vào ô "Password"
        data: secret_sauce
        expected: Ô Password được điền bảo mật
      - step: 3
        action: Click vào nút "Login"
        expected: Điều hướng thành công vào trang danh mục /inventory.html
    assertions:
      - Products hiển thị

  - id: TC-ECOMMERCE-002
    title: Kiểm tra chặn gửi form khi bỏ trống Username (Negative Validation)
    description: Đảm bảo hệ thống bắt buộc nhập Username trước khi đăng nhập
    priority: P1
    type: negative_validation
    tags:
      - negative
      - validation
      - required_fields
      - p1
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Click vào nút "Login"
        expected: Hệ thống chặn gửi và hiển thị cảnh báo lỗi
    assertions:
      - Username is required hiển thị

  - id: TC-ECOMMERCE-003
    title: Kiểm tra chặn gửi form khi bỏ trống Password (Negative Validation)
    description: Đảm bảo hệ thống bắt buộc nhập Password khi đã có Username
    priority: P1
    type: negative_validation
    tags:
      - negative
      - validation
      - required_fields
      - p1
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "standard_user" vào ô "Username"
        data: standard_user
        expected: Ô Username hiển thị standard_user
      - step: 2
        action: Click vào nút "Login"
        expected: Hệ thống cảnh báo thiếu Password
    assertions:
      - Password is required hiển thị

  - id: TC-ECOMMERCE-004
    title: Kiểm tra tài khoản bị khóa trong hệ thống (Locked Out User)
    description: Xác thực cơ chế chặn đăng nhập với tài khoản vi phạm chính sách
    priority: P1
    type: negative_validation
    tags:
      - negative
      - security
      - p1
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "locked_out_user" vào ô "Username"
        data: locked_out_user
        expected: Ô Username hiển thị locked_out_user
      - step: 2
        action: Điền "secret_sauce" vào ô "Password"
        data: secret_sauce
        expected: Ô Password được điền
      - step: 3
        action: Click vào nút "Login"
        expected: Hiển thị thông báo tài khoản bị khóa
    assertions:
      - Sorry, this user has been locked out hiển thị

  - id: TC-ECOMMERCE-005
    title: Thử nghiệm tiêm mã độc SQL Injection (Security Probing)
    description: Bơm chuỗi adversarial payload từ naughty-strings.json vào ô đăng nhập
    priority: P2
    type: security_probe
    tags:
      - security
      - sqli
      - p2
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "' OR '1'='1" vào ô "Username"
        data: "' OR '1'='1"
        expected: Ô Username nhận chuỗi kiểm thử
      - step: 2
        action: Điền "secret_sauce" vào ô "Password"
        data: secret_sauce
        expected: Ô Password được điền
      - step: 3
        action: Click vào nút "Login"
        expected: Hệ thống từ chối an toàn mà không sập dịch vụ
    assertions:
      - Username and password do not match hiển thị

  - id: TC-ECOMMERCE-006
    title: Kiểm tra sai mật khẩu xác thực (Authentication Failure)
    description: Xác thực cơ chế kiểm tra mật khẩu không chính xác
    priority: P2
    type: boundary_value
    tags:
      - boundary
      - auth
      - p2
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "standard_user" vào ô "Username"
        data: standard_user
        expected: Ô Username được điền
      - step: 2
        action: Điền "sai_mat_khau_123" vào ô "Password"
        data: sai_mat_khau_123
        expected: Ô Password được điền mật khẩu không đúng
      - step: 3
        action: Click vào nút "Login"
        expected: Báo lỗi thông tin đăng nhập không khớp
    assertions:
      - Username and password do not match hiển thị

  - id: TC-ECOMMERCE-007
    title: Thêm sản phẩm vào giỏ hàng (Functionality Flow)
    description: Xác thực luồng nghiệp vụ thêm sản phẩm và nút chuyển sang trạng thái Remove
    priority: P1
    type: happy_path
    tags:
      - core
      - cart
      - p1
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "standard_user" vào ô "Username"
        data: standard_user
        expected: Ô Username được điền
      - step: 2
        action: Điền "secret_sauce" vào ô "Password"
        data: secret_sauce
        expected: Ô Password được điền
      - step: 3
        action: Click vào nút "Login"
        expected: Vào trang sản phẩm
      - step: 4
        action: Click vào nút "Add to cart"
        expected: Nút chuyển sang trạng thái Remove
    assertions:
      - Remove hiển thị

  - id: TC-ECOMMERCE-008
    title: Khôi phục trạng thái giỏ hàng sau khi hủy (Idempotency)
    description: Đảm bảo thao tác thêm và xóa sản phẩm đưa trạng thái về ban đầu
    priority: P2
    type: idempotency
    tags:
      - idempotency
      - state
      - p2
    preconditions:
      - Trình duyệt mở tại trang https://www.saucedemo.com/
    steps:
      - step: 1
        action: Điền "standard_user" vào ô "Username"
        data: standard_user
        expected: Ô Username được điền
      - step: 2
        action: Điền "secret_sauce" vào ô "Password"
        data: secret_sauce
        expected: Ô Password được điền
      - step: 3
        action: Click vào nút "Login"
        expected: Vào trang sản phẩm
      - step: 4
        action: Click vào nút "Add to cart"
        expected: Nút chuyển sang Remove
      - step: 5
        action: Click vào nút "Remove"
        expected: Nút hoàn nguyên về Add to cart
    assertions:
      - Add to cart hiển thị
